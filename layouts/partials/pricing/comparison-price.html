{{- if eq .plan.dataKey "Standard" }}
<p x-text="formattedPrice" class="font-semibold text-2xl @min-[72rem]:text-lg tabular-nums"></p>
<p class="text-gray-700">{{ i18n "pricing_vat_excluded" .page }}</p>
{{- else }}
<p class="font-semibold text-2xl @min-[72rem]:text-lg">{{ i18n .plan.priceKey .page }}</p>
{{- end }}
<p class="text-gray-700">{{ i18n .plan.priceDescriptionKey .page }}</p>
